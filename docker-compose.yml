services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in the deployment environment}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the deployment environment}
      - FILE_URL_SECRET=${FILE_URL_SECRET:?Set FILE_URL_SECRET in the deployment environment}
      - APP_URL=${APP_URL:?Set APP_URL in the deployment environment}
      - SMTP_HOST=${SMTP_HOST:?Set SMTP_HOST in the deployment environment}
      - SMTP_USER=${SMTP_USER:?Set SMTP_USER in the deployment environment}
      - SMTP_PASS=${SMTP_PASS:?Set SMTP_PASS in the deployment environment}
      - REDIS_URL=redis://redis:6379
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - GONKA_API_KEY=${GONKA_API_KEY}
      - GONKA_BASE_URL=${GONKA_BASE_URL:-https://api.gonkarouter.io/v1}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - uploads_data:/app/uploads
      - generated_data:/app/data
      - exports_data:/app/exports

  # ── Python Universal File API (port 8000) ──────────────────────────────────
  file_api:
    build:
      context: ./python_service
      dockerfile: Dockerfile.python
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///./file_service.db
      - GONKA_API_KEY=${GONKA_API_KEY}
      - GONKA_BASE_URL=${GONKA_BASE_URL:-https://api.gonkarouter.io/v1}
      - GONKA_MODEL=${GONKA_MODEL:-zai-org/GLM-5.3-Flash}
      - JWT_SECRET=${JWT_SECRET}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-ai-marker-hub}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - AUTH_ENABLED=true
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,${APP_URL:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ai_marker_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      APP_DATABASE_USER: ${APP_DATABASE_USER:-bwenge_app}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in the deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./production/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
  generated_data:
  exports_data:
