name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths: ['mobile-app/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key (optional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            # No secrets configured: make a throwaway key so the APK is still installable.
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass bwengeapk -keypass bwengeapk \
              -alias bwenge -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bwenge"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          if [ -n "$KS" ]; then
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PASSWORD=bwengeapk" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=bwenge" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=bwengeapk" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew --no-daemon assembleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: bwenge-apk
          path: mobile-app/app/build/outputs/apk/release/*.apk
      - name: Publish public release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile-app/app/build/outputs/apk/release/*.apk Bwenge.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest Bwenge.apk --target "$GITHUB_SHA" --latest \
            --title "Bwenge for Android" \
            --notes "Download Bwenge.apk, open it on your Android phone and install. Allow installs from this source if asked."
