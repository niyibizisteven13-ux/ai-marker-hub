name: Bwenge4Biz Android launcher
run-name: 'Bwenge4Biz APK · ${{ inputs.business_slug }}'
on:
  workflow_dispatch:
    inputs:
      business_slug:
        description: Published Bwenge4Biz slug
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed business APK
        env:
          BUSINESS_SLUG: ${{ inputs.business_slug }}
          BIZ_APK_KEYSTORE_BASE64: ${{ secrets.BIZ_APK_KEYSTORE_BASE64 }}
          BIZ_APK_KEY_ALIAS: ${{ secrets.BIZ_APK_KEY_ALIAS }}
          BIZ_APK_KEY_PASSWORD: ${{ secrets.BIZ_APK_KEY_PASSWORD }}
        run: |
          [[ "$BUSINESS_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]
          umask 077
          export BIZ_APK_KEYSTORE="$RUNNER_TEMP/biz-app-signing.jks"
          trap 'rm -f "$BIZ_APK_KEYSTORE"' EXIT
          printf '%s' "$BIZ_APK_KEYSTORE_BASE64" | base64 --decode > "$BIZ_APK_KEYSTORE"
          python3 scripts/build-biz-apk.py "$BUSINESS_SLUG" --version-code "$GITHUB_RUN_NUMBER" --output "apk/$BUSINESS_SLUG.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: bwenge4biz-${{ inputs.business_slug }}
          path: apk/*.apk
          if-no-files-found: error
