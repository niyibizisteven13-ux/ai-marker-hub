name: Build MySEB apps

# Builds the student apps pointing at your site: Windows installer, macOS dmg, Linux AppImage and an Android APK.
# Run it from the Actions tab ("Run workflow"), or push a tag like myseb-v1.0.0 to also publish a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: Address of the MySEB server the apps will talk to
        default: https://bwenge.space/myseb
  push:
    tags: ['myseb-v*']

permissions:
  contents: write

env:
  API_BASE: ${{ inputs.api_base || 'https://bwenge.space/myseb' }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: myseb/desktop, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Point the app at the server
        run: |
          printf '{ "apiBase": "%s" }\n' "$API_BASE" > config.json
          cat config.json
      - run: npm ci
      - run: npx electron-builder --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: myseb-desktop-${{ matrix.os }}
          path: |
            myseb/desktop/dist/*.exe
            myseb/desktop/dist/*.dmg
            myseb/desktop/dist/*.AppImage

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: myseb/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # Android's "lint vital" check crashes on some libraries (it needs a newer Java than the plugin build uses); it only checks code
      # style, so it is switched off for this release build.
      - name: Skip the lint check that crashes
        working-directory: .
        run: |
          mkdir -p ~/.gradle/init.d
          printf 'allprojects { tasks.configureEach { t -> if (t.name.startsWith("lintVital") || t.name.startsWith("lintAnalyze")) t.enabled = false } }\n' > ~/.gradle/init.d/no-lint.gradle
      - run: bash setup.sh
      - run: flutter build apk --release --dart-define=MYSEB_API=${{ env.API_BASE }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MySEB.apk
      - uses: actions/upload-artifact@v4
        with:
          name: myseb-android
          path: myseb/mobile/build/app/outputs/flutter-apk/MySEB.apk

  # iPhone. Always builds an unsigned copy to prove the app compiles (kept as a download of this run only: an unsigned iPhone app
  # cannot be installed normally and is never published). If the Apple secrets are set (see myseb/docs/IOS.md), it also signs the app
  # and sends it to TestFlight. This job does not hold back the other apps' release.
  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: myseb/mobile } }
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: bash setup.sh
      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=MYSEB_API=${{ env.API_BASE }}
      - name: Keep the unsigned copy of this run
        run: |
          mkdir Payload && cp -R build/ios/iphoneos/Runner.app Payload/ && zip -qry MySEB-iphone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: myseb-iphone-unsigned
          path: myseb/mobile/MySEB-iphone-unsigned.ipa
      - name: Sign and send to TestFlight
        if: ${{ env.ASC_KEY_P8 != '' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          flutter build ios --config-only --release --no-codesign --build-number=${{ github.run_number }} --dart-define=MYSEB_API=${{ env.API_BASE }}
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/AuthKey.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic $AUTH archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" $AUTH
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  release:
    if: startsWith(github.ref, 'refs/tags/myseb-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: apps, merge-multiple: true }
      - name: Publish the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for file in MySEB-win.exe MySEB-mac.dmg MySEB-linux.AppImage MySEB.apk; do
            test -s "apps/$file" || { echo "Missing installer: $file"; exit 1; }
          done
          tag="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="myseb-v1.0.0-build.${{ github.run_number }}.${{ github.run_attempt }}"
          fi
          gh release create "$tag" apps/MySEB-win.exe apps/MySEB-mac.dmg apps/MySEB-linux.AppImage apps/MySEB.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "MySEB $tag" --notes "Student apps for $API_BASE" --latest=false
