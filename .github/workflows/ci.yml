name: CI

# Every push to main and every pull request: types, security checks, the full test suite (also against a real
# PostgreSQL and Redis), and a production build. A red run means the change is not ready to deploy.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bwenge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bwenge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bwenge" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI_DATABASE_URL: postgresql://bwenge:ci-only-password@127.0.0.1:5432/bwenge?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: No secrets or temporary files committed
        run: npm run --silent security:check

      - name: No known high or critical vulnerabilities in production dependencies
        run: node scripts/audit-gate.mjs

      # The code-testing runner puts each student program in its own network namespace (`unshare -rn`). Ubuntu 24.04
      # runners forbid that for unprivileged users, so every program fails to start and is reported as an error.
      - name: Allow the code runner's sandbox (user namespaces)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn -- true || { echo "::error::unshare -rn is still refused on this runner; the code runner tests cannot run"; exit 1; }

      - name: Tests
        run: node --test --test-reporter=spec --import tsx tests/*.test.ts

      # MySEB (secure exam app) server: end-to-end tests against a real PostgreSQL, in their own database.
      - name: MySEB server tests
        env:
          PGPASSWORD: ci-only-password
          DATABASE_URL: postgresql://bwenge:ci-only-password@127.0.0.1:5432/myseb_ci
        run: |
          psql -h 127.0.0.1 -U bwenge -d bwenge -c 'CREATE DATABASE myseb_ci'
          cd myseb/backend
          npm ci
          npm test
          cd ../..
          EMBED_TEST_DATABASE_URL=$DATABASE_URL node --test --import tsx tests/myseb_embedded.test.ts

      - name: Database schema from an empty PostgreSQL
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: bash scripts/db-bootstrap-empty.sh

      - name: Tests against PostgreSQL
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          REDIS_URL: redis://127.0.0.1:6379/0
        run: npm run test:db && node --test --import tsx tests/production_hardening.test.ts

      - name: Production build
        run: npm run build

      - name: Keep backend bundles outside the public build
        run: |
          test -f dist/server.js
          test -f dist/web/index.html
          test -f dist/web/scanner.html
          test -z "$(find dist/web -type f \( -name server.js -o -name server.js.map \) -print -quit)"

      - name: Cluster scripts parse
        run: for f in scripts/cluster/*.sh scripts/db-bootstrap-empty.sh; do bash -n "$f"; done
