app = "ai-marker-hub"
primary_region = "arn"          # keep if your database is in Stockholm

kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  AI_PROVIDER = "gonkarouter"
  ALLOW_GEMINI_FALLBACK = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    idle_timeout = 600          # streamed AI answers can stay open for minutes

  [[http_service.checks]]       # replaces [[services.http_checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[deploy]
  release_command = "npx prisma migrate deploy"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
